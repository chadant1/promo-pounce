name: Build deals & deploy app

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'   # refresh the Hot list every 3 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch hot deals
        run: node scripts/fetch-deals.mjs
        continue-on-error: true
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html styles.css sw.js manifest.webmanifest js icons data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
